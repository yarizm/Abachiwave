[project]
name = "abachiwave"
version = "0.1.0"
description = "AI-assisted music creation workspace."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "alembic>=1.13.3",
    "arq>=0.26.3",
    "asyncpg>=0.29.0",
    "boto3>=1.35.0",
    "fastapi>=0.115.0",
    "greenlet>=3.0.3",
    "langgraph>=0.2.39",
    "mido>=1.3.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.35",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.30.6",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "httpx>=0.27.2",
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.6.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abachiwave"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["abachiwave"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["arq.*", "boto3.*", "botocore.*", "langgraph.*", "alembic.*", "mido.*"]
ignore_missing_imports = true
