name: CI

on:
  pull_request:
  push:
    branches: ["master", "main"]

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Audit Python dependencies
        run: uvx pip-audit .
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Audit Node dependencies
        working-directory: web
        run: npm audit --audit-level=high
      - name: Scan repository for secrets
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.24.2
          dir /repo --redact --no-banner

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install backend dependencies
        run: uv sync --all-groups --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://abachiwave:abachiwave@localhost:5432/abachiwave
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: abachiwave-ci
      TASK_TIMEOUT_SECONDS: 120
      ABACHIWAVE_API_BASE_URL: http://localhost:8000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: abachiwave
          POSTGRES_USER: abachiwave
          POSTGRES_PASSWORD: abachiwave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abachiwave -d abachiwave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install backend dependencies
        run: uv sync --all-groups --frozen
      - name: Start MinIO
        run: >-
          docker run --detach --name abachiwave-minio
          --publish 9000:9000
          --env MINIO_ROOT_USER=minioadmin
          --env MINIO_ROOT_PASSWORD=minioadmin
          minio/minio:RELEASE.2024-12-18T13-15-44Z
          server /data
      - name: Create integration bucket
        run: uv run python scripts/ensure_bucket.py
      - name: Migrate and run MVP smoke
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run uvicorn abachiwave.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          api_pid=$!
          uv run arq abachiwave.worker.WorkerSettings > worker.log 2>&1 &
          worker_pid=$!
          cleanup() {
            kill "$api_pid" "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          uv run python scripts/smoke_mvp.py
      - name: Capture MinIO logs
        if: always()
        run: docker logs abachiwave-minio > minio.log 2>&1 || true
      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs
          path: |
            api.log
            worker.log
            minio.log
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: Browser
    runs-on: ubuntu-latest
    needs: [integration]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start application stack
        run: docker compose up -d --build
      - name: Wait for application readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/health/ready >/dev/null \
              && curl --fail --silent http://localhost:3000/projects >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Run browser tests
        working-directory: web
        env:
          CI: true
          ABACHIWAVE_WEB_BASE_URL: http://localhost:3000
          ABACHIWAVE_API_BASE_URL: http://localhost:8000
        run: npm run test:e2e
      - name: Capture service logs
        if: always()
        run: docker compose logs --no-color > browser-services.log 2>&1 || true
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-artifacts
          path: |
            web/test-results
            web/playwright-report
            browser-services.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop application stack
        if: always()
        run: docker compose down --volumes
