services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: abachiwave
      POSTGRES_USER: abachiwave
      POSTGRES_PASSWORD: abachiwave
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abachiwave -d abachiwave"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/abachiwave-dev;
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: >
      sh -c "alembic upgrade head &&
      uvicorn abachiwave.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      APP_ENV: development
      DEMO_PROVIDER_NAME: ${DEMO_PROVIDER_NAME:-local_deterministic_wav}
      AUDIO_TO_MIDI_PROVIDER_NAME: ${AUDIO_TO_MIDI_PROVIDER_NAME:-local_monophonic_wav_to_midi}
      BASIC_PITCH_SERVICE_URL: ${BASIC_PITCH_SERVICE_URL:-http://basic-pitch:8080}
      BASIC_PITCH_TIMEOUT_SECONDS: ${BASIC_PITCH_TIMEOUT_SECONDS:-90}
      DATABASE_URL: postgresql+asyncpg://abachiwave:abachiwave@postgres:5432/abachiwave
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: abachiwave-dev
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-120}
      TEXT_PROVIDER_API_BASE_URL: ${TEXT_PROVIDER_API_BASE_URL:-}
      TEXT_PROVIDER_API_KEY: ${TEXT_PROVIDER_API_KEY:-}
      TEXT_PROVIDER_MODEL: ${TEXT_PROVIDER_MODEL:-}
      TEXT_PROVIDER_TIMEOUT_SECONDS: ${TEXT_PROVIDER_TIMEOUT_SECONDS:-60}
      TEXT_EVALUATION_TIMEOUT_SECONDS: ${TEXT_EVALUATION_TIMEOUT_SECONDS:-600}
      MAX_PROJECT_UPLOADS: 100
      MAX_EXPORT_BUNDLE_BYTES: 536870912
      PYTHONPATH: /app/src
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: arq abachiwave.worker.WorkerSettings
    environment:
      APP_ENV: development
      DEMO_PROVIDER_NAME: ${DEMO_PROVIDER_NAME:-local_deterministic_wav}
      DATABASE_URL: postgresql+asyncpg://abachiwave:abachiwave@postgres:5432/abachiwave
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: abachiwave-dev
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-120}
      TEXT_PROVIDER_API_BASE_URL: ${TEXT_PROVIDER_API_BASE_URL:-}
      TEXT_PROVIDER_API_KEY: ${TEXT_PROVIDER_API_KEY:-}
      TEXT_PROVIDER_MODEL: ${TEXT_PROVIDER_MODEL:-}
      TEXT_PROVIDER_TIMEOUT_SECONDS: ${TEXT_PROVIDER_TIMEOUT_SECONDS:-60}
      TEXT_EVALUATION_TIMEOUT_SECONDS: ${TEXT_EVALUATION_TIMEOUT_SECONDS:-600}
      MAX_PROJECT_UPLOADS: 100
      MAX_EXPORT_BUNDLE_BYTES: 536870912
      PYTHONPATH: /app/src
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "--check", "abachiwave.worker.WorkerSettings"]
      interval: 10s
      timeout: 15s
      retries: 6

  audio-midi-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: arq abachiwave.worker.AudioToMidiWorkerSettings
    environment:
      APP_ENV: development
      AUDIO_TO_MIDI_PROVIDER_NAME: ${AUDIO_TO_MIDI_PROVIDER_NAME:-local_monophonic_wav_to_midi}
      BASIC_PITCH_SERVICE_URL: ${BASIC_PITCH_SERVICE_URL:-http://basic-pitch:8080}
      BASIC_PITCH_TIMEOUT_SECONDS: ${BASIC_PITCH_TIMEOUT_SECONDS:-90}
      DATABASE_URL: postgresql+asyncpg://abachiwave:abachiwave@postgres:5432/abachiwave
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: abachiwave-dev
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-120}
      PYTHONPATH: /app/src
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "--check", "abachiwave.worker.AudioToMidiWorkerSettings"]
      interval: 10s
      timeout: 15s
      retries: 6

  basic-pitch:
    profiles: ["basic-pitch"]
    build:
      context: .
      dockerfile: Dockerfile.basic-pitch
    environment:
      BASIC_PITCH_MAX_AUDIO_BYTES: 26214400
      BASIC_PITCH_EXPECTED_VERSION: "0.4.0"
    ports:
      - "127.0.0.1:8010:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18

  ffmpeg-worker:
    profiles: ["ffmpeg"]
    build:
      context: .
      dockerfile: Dockerfile.ffmpeg-worker
    command: arq abachiwave.worker.FFmpegWorkerSettings
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://abachiwave:abachiwave@postgres:5432/abachiwave
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: abachiwave-dev
      TASK_TIMEOUT_SECONDS: 120
      FFMPEG_BINARY: ffmpeg
      FFMPEG_TIMEOUT_SECONDS: 120
      PYTHONPATH: /app/src
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ffmpeg -version >/dev/null && arq --check abachiwave.worker.FFmpegWorkerSettings"]
      interval: 10s
      timeout: 15s
      retries: 6

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: development
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/projects').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  minio_data:
  web_node_modules:
  web_next_cache:
