services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: abachiwave
      POSTGRES_USER: abachiwave
      POSTGRES_PASSWORD: abachiwave
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abachiwave -d abachiwave"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/abachiwave-dev;
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: >
      sh -c "alembic upgrade head &&
      uvicorn abachiwave.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://abachiwave:abachiwave@postgres:5432/abachiwave
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: abachiwave-dev
      TASK_TIMEOUT_SECONDS: 120
      MAX_PROJECT_UPLOADS: 100
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: arq abachiwave.worker.WorkerSettings
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://abachiwave:abachiwave@postgres:5432/abachiwave
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: abachiwave-dev
      TASK_TIMEOUT_SECONDS: 120
      MAX_PROJECT_UPLOADS: 100
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  web_node_modules:
